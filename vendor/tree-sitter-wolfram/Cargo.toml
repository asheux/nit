[package]
name = "tree-sitter-wolfram"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Wolfram Language grammar for tree-sitter (vendored from bostick/tree-sitter-wolfram)"
publish = false
build = "build.rs"

# Vendored grammar source. Upstream (bostick/tree-sitter-wolfram, MIT) is not on
# crates.io and its Rust binding pins tree-sitter ~0.20; we ship only the C
# parser + C++ scanner and expose the version-agnostic `LanguageFn` so the
# ABI-13 grammar links into nit's tree-sitter 0.25 runtime (which loads ABI 13).
[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
